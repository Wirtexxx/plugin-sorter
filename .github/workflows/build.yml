name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint script
        run: bash -n scripts/sort-plugins.sh

      - name: Build app
        run: ./build.sh

      - name: Package
        run: ditto -c -k --keepParent "build/Plugin Sorter.app" build/PluginSorter.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PluginSorter
          path: build/PluginSorter.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PluginSorter.zip
          generate_release_notes: true
