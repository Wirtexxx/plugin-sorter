name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
    # Tags ignore this filter, so a release always builds
    paths-ignore: ["web/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["web/**", "docs/**", "**.md"]

permissions:
  contents: write

# A push to develop with an open PR triggers both "push" and "pull_request" for the same code.
# Group them by branch so only the newest one waits for a macOS runner; tags and main always finish.
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref_name != 'main' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint scripts
        run: bash -n scripts/sort-plugins.sh && bash -n build.sh

      - name: Run tests
        run: swift test

      - name: Build app and DMG
        run: ./build.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PluginSorter
          path: app/build/PluginSorter.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/PluginSorter.dmg
          generate_release_notes: true
