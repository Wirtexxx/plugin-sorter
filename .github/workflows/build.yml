name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
    # Tags ignore this filter, so a release always builds
    paths-ignore: ["web/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["web/**", "docs/**", "**.md"]

permissions:
  contents: read

# A push to develop with an open PR triggers both "push" and "pull_request" for the same code.
# Group them by branch so only the newest one waits for a macOS runner; tags and main always finish.
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref_name != 'main' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint scripts
        run: bash -n scripts/sort-plugins.sh && bash -n build.sh

      - name: Run tests
        run: swift test

      - name: Build app and DMG
        run: ./build.sh --dmg

      - uses: actions/upload-artifact@v7
        with:
          name: PluginSorter
          path: app/build/PluginSorter.dmg

  # The only job allowed to write to the repository, and it runs none of the project's code.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PluginSorter

      - name: Add a checksum
        run: shasum -a 256 PluginSorter.dmg > PluginSorter.dmg.sha256

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            PluginSorter.dmg
            PluginSorter.dmg.sha256
          generate_release_notes: true
